    <script>
      ;(() => {
        try {
          const stored = localStorage.getItem('trucktap.theme')
          const dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch {
          /* Theme falls back to CSS defaults. */
        }
      })()
    </script>
    <script type="module" crossorigin src="/assets/app-Bne70PNj.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/app-CRg-7nT2.css">
