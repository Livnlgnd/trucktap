appId: com.trucktap.desktop
productName: TruckTap
copyright: Copyright © 2026 TruckTap

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!node_modules/**/*'

extraFiles:
  - from: docs/user
    to: .
    filter:
      - TruckTap-User-Guide.pdf
      - TruckTap-README.txt
      - TRUCKTAP-TERMS.txt

asar: true
compression: normal

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  artifactName: TruckTap-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TruckTap
  uninstallDisplayName: TruckTap
  license: license.txt
  include: build/installer.nsh
