appId: com.trucktap.desktop
productName: TruckTap
copyright: Copyright © 2026 TruckTap

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!node_modules/@capacitor*/**/*'
  - '!node_modules/@neondatabase/**/*'
  - '!node_modules/@types/**/*'
  - '!node_modules/dexie/**/*'
  - '!node_modules/dexie-react-hooks/**/*'
  - '!node_modules/lucide-react/**/*'
  - '!node_modules/react/**/*'
  - '!node_modules/react-dom/**/*'
  - '!node_modules/scheduler/**/*'
  - '!node_modules/ws/**/*'
  - '!node_modules/zod/**/*'

extraFiles:
  - from: docs/user
    to: .
    filter:
      - TruckTap-User-Guide.pdf
      - TruckTap-README.txt
      - TRUCKTAP-TERMS.txt

publish:
  provider: github
  owner: Livnlgnd
  repo: trucktap
  releaseType: release

asar: true
compression: normal

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  artifactName: TruckTap-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TruckTap
  uninstallDisplayName: TruckTap
  license: license.txt
  include: build/installer.nsh
